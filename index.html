
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NO STRESS RACING</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10151e;color:white;font-family:Arial,sans-serif;text-align:center}
h1{font-size:25px;margin:15px 0 8px;color:#ffd54a}
#info{display:flex;justify-content:center;gap:13px;flex-wrap:wrap;margin:10px;font-size:14px}
#game{display:block;width:min(96vw,480px);height:auto;margin:auto;background:#252b32;border:3px solid #596273;border-radius:9px}
#controls,#actions{width:min(96vw,480px);margin:10px auto;display:grid;gap:6px}
#controls{grid-template-columns:repeat(5,1fr)}
#actions{grid-template-columns:1fr 1fr}
button,select{border:0;border-radius:10px;padding:13px 4px;background:#303e53;color:white;font-weight:bold;font-size:13px;touch-action:none}
button:active{filter:brightness(1.4)}
#start{background:#e4ad28;color:#151515}
#shock{background:#167cbd}
#dash{background:#bd542b}
#lifeChoice{margin:10px auto;display:flex;align-items:center;justify-content:center;gap:10px}
select{background:#303e53;padding:10px 16px;font-size:15px}
#help{font-size:12px;color:#c5ccd6;margin:12px auto 22px;line-height:1.7}
#languageBar{width:min(96vw,480px);margin:10px auto 4px;display:flex;justify-content:flex-end;align-items:center;gap:7px;font-size:12px;color:#c5ccd6}
#languageSelect{padding:7px 10px;font-size:12px;max-width:170px}
</style>
</head>
<body>

<div id="languageBar"><label id="languageLabel" for="languageSelect">🌐 Language</label><select id="languageSelect" aria-label="Choose language"></select></div>
<h1>🏁 NO STRESS RACING</h1>

<div id="info">
 <span>🏆 <span id="scoreLabel">Score</span>: <b id="score">0</b></span>
 <span>🪙 <span id="coinsLabel">Coins</span>: <b id="coins">0</b></span>
 <span>🚦 <span id="stageLabel">Stage</span>: <b id="stage">1</b></span>
 <span>❤️ <span id="livesLabel">Lives</span>: <b id="lives">3</b></span>
</div>

<div id="lifeChoice">
 <label id="lifeChoiceLabel" for="lifeSelect">❤️ SELECT LIVES</label>
 <select id="lifeSelect">
  <option value="3" selected>3 Lives</option>
  <option value="5">5 Lives</option>
  <option value="10">10 Lives</option>
 </select>
</div>

<canvas id="game" width="480" height="720"></canvas>

<div id="controls">
 <button data-key="ArrowLeft" id="leftBtn">⬅ LEFT</button>
 <button data-key="ArrowDown" id="brakeBtn">⬇ BRAKE</button>
 <button data-key="ArrowUp" id="boostBtn">⬆ BOOST</button>
 <button data-key="ArrowRight" id="rightBtn">RIGHT ➡</button>
 <button id="start">START</button>
</div>

<div id="actions">
 <button id="shock">💥 SHOCKWAVE<br>5 COINS</button>
 <button id="dash">🔥 DASH<br>10 COINS</button>
</div>

<div id="help">
 Keyboard: ← → Move · ↑ Accelerate · ↓ Brake<br>
 Collect coins, avoid traffic and reach higher stages!<br>
 Shockwave pushes nearby cars away. Dash destroys cars only on collision.
</div>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);

// Shared language preference used by all NoStress games.
const LANGUAGE_KEY='nostressLanguage';
const LANGUAGES={
 en:{name:'English',language:'🌐 Language',score:'Score',coins:'Coins',stage:'Stage',lives:'Lives',selectLives:'❤️ SELECT LIVES',left:'⬅ LEFT',brake:'⬇ BRAKE',boost:'⬆ BOOST',right:'RIGHT ➡',start:'START',shock:'💥 SHOCKWAVE<br>5 COINS',dash:'🔥 DASH<br>10 COINS',help:'Keyboard: ← → Move · ↑ Accelerate · ↓ Brake<br>Collect coins, avoid traffic and reach higher stages!<br>Shockwave pushes nearby cars away. Dash destroys cars only on collision.',gameOver:'GAME OVER',finalScore:'Final Score: ',stageCoins:'Stage {stage}  •  Coins {coins}',playAgain:'Press START to play again',title:'SELECT LIVES & PRESS START',lifeOptions:'3  /  5  /  10 Lives'},
 ko:{name:'한국어',language:'🌐 언어',score:'점수',coins:'코인',stage:'스테이지',lives:'목숨',selectLives:'❤️ 목숨 선택',left:'⬅ 왼쪽',brake:'⬇ 브레이크',boost:'⬆ 가속',right:'오른쪽 ➡',start:'시작',shock:'💥 충격파<br>5 코인',dash:'🔥 대시<br>10 코인',help:'키보드: ← → 이동 · ↑ 가속 · ↓ 브레이크<br>코인을 모으고 차량을 피하면서 더 높은 스테이지에 도전하세요!<br>충격파는 주변 차량을 밀어냅니다. 대시는 차량과 실제로 충돌했을 때만 파괴합니다.',gameOver:'게임 종료',finalScore:'최종 점수: ',stageCoins:'스테이지 {stage}  •  코인 {coins}',playAgain:'다시 하려면 시작을 누르세요',title:'목숨을 선택하고 시작을 누르세요',lifeOptions:'목숨 3 / 5 / 10'},
 ja:{name:'日本語',language:'🌐 言語',score:'スコア',coins:'コイン',stage:'ステージ',lives:'ライフ',selectLives:'❤️ ライフを選択',left:'⬅ 左',brake:'⬇ ブレーキ',boost:'⬆ 加速',right:'右 ➡',start:'スタート',shock:'💥 衝撃波<br>5コイン',dash:'🔥 ダッシュ<br>10コイン',help:'操作: ← → 移動 · ↑ 加速 · ↓ ブレーキ<br>コインを集め、車を避けて高いステージを目指しましょう！<br>衝撃波は近くの車を押しのけます。ダッシュは車に実際に衝突したときだけ破壊します。',gameOver:'ゲームオーバー',finalScore:'最終スコア: ',stageCoins:'ステージ {stage}  •  コイン {coins}',playAgain:'再プレイするにはスタートを押してください',title:'ライフを選んでスタートを押してください',lifeOptions:'ライフ 3 / 5 / 10'},

 es:{name:'Español',language:'🌐 Idioma',score:'Puntuación',coins:'Monedas',stage:'Etapa',lives:'Vidas',selectLives:'❤️ ELEGIR VIDAS',left:'⬅ IZQUIERDA',brake:'⬇ FRENAR',boost:'⬆ ACELERAR',right:'DERECHA ➡',start:'INICIAR',shock:'💥 ONDA DE CHOQUE<br>5 MONEDAS',dash:'🔥 IMPULSO<br>10 MONEDAS',help:'Teclado: ← → Mover · ↑ Acelerar · ↓ Frenar<br>¡Recoge monedas, esquiva el tráfico y alcanza etapas superiores!<br>La onda de choque aleja los coches cercanos. El impulso destruye coches solo al chocar con ellos.',gameOver:'FIN DEL JUEGO',finalScore:'Puntuación final: ',stageCoins:'Etapa {stage}  •  Monedas {coins}',playAgain:'Pulsa INICIAR para volver a jugar',title:'ELIGE VIDAS Y PULSA INICIAR',lifeOptions:'3 / 5 / 10 vidas'},
 fr:{name:'Français',language:'🌐 Langue',score:'Score',coins:'Pièces',stage:'Niveau',lives:'Vies',selectLives:'❤️ CHOISIR LES VIES',left:'⬅ GAUCHE',brake:'⬇ FREIN',boost:'⬆ ACCÉLÉRER',right:'DROITE ➡',start:'DÉMARRER',shock:'💥 ONDE DE CHOC<br>5 PIÈCES',dash:'🔥 BOOST<br>10 PIÈCES',help:'Clavier : ← → Déplacer · ↑ Accélérer · ↓ Freiner<br>Collectez des pièces, évitez la circulation et atteignez des niveaux supérieurs !<br>L’onde de choc repousse les voitures proches. Le boost détruit les voitures uniquement en cas de collision.',gameOver:'FIN DE PARTIE',finalScore:'Score final : ',stageCoins:'Niveau {stage}  •  Pièces {coins}',playAgain:'Appuyez sur DÉMARRER pour rejouer',title:'CHOISISSEZ LES VIES ET DÉMARREZ',lifeOptions:'3 / 5 / 10 vies'},
 de:{name:'Deutsch',language:'🌐 Sprache',score:'Punktzahl',coins:'Münzen',stage:'Stufe',lives:'Leben',selectLives:'❤️ LEBEN WÄHLEN',left:'⬅ LINKS',brake:'⬇ BREMSEN',boost:'⬆ BESCHLEUNIGEN',right:'RECHTS ➡',start:'START',shock:'💥 SCHOCKWELLE<br>5 MÜNZEN',dash:'🔥 TURBO<br>10 MÜNZEN',help:'Tastatur: ← → Bewegen · ↑ Beschleunigen · ↓ Bremsen<br>Sammle Münzen, weiche dem Verkehr aus und erreiche höhere Stufen!<br>Die Schockwelle stößt nahe Autos weg. Turbo zerstört Autos nur bei einer Kollision.',gameOver:'SPIEL VORBEI',finalScore:'Endpunktzahl: ',stageCoins:'Stufe {stage}  •  Münzen {coins}',playAgain:'Drücke START, um erneut zu spielen',title:'LEBEN WÄHLEN UND START DRÜCKEN',lifeOptions:'3 / 5 / 10 Leben'},
 pt:{name:'Português',language:'🌐 Idioma',score:'Pontuação',coins:'Moedas',stage:'Fase',lives:'Vidas',selectLives:'❤️ ESCOLHER VIDAS',left:'⬅ ESQUERDA',brake:'⬇ FREAR',boost:'⬆ ACELERAR',right:'DIREITA ➡',start:'INICIAR',shock:'💥 ONDA DE CHOQUE<br>5 MOEDAS',dash:'🔥 IMPULSO<br>10 MOEDAS',help:'Teclado: ← → Mover · ↑ Acelerar · ↓ Frear<br>Colete moedas, desvie do trânsito e alcance fases mais altas!<br>A onda de choque afasta os carros próximos. O impulso destrói carros somente ao colidir.',gameOver:'FIM DE JOGO',finalScore:'Pontuação final: ',stageCoins:'Fase {stage}  •  Moedas {coins}',playAgain:'Pressione INICIAR para jogar novamente',title:'ESCOLHA AS VIDAS E PRESSIONE INICIAR',lifeOptions:'3 / 5 / 10 vidas'},
 it:{name:'Italiano',language:'🌐 Lingua',score:'Punteggio',coins:'Monete',stage:'Livello',lives:'Vite',selectLives:'❤️ SCEGLI LE VITE',left:'⬅ SINISTRA',brake:'⬇ FRENA',boost:'⬆ ACCELERA',right:'DESTRA ➡',start:'INIZIA',shock:'💥 ONDA D’URTO<br>5 MONETE',dash:'🔥 SCATTO<br>10 MONETE',help:'Tastiera: ← → Muovi · ↑ Accelera · ↓ Frena<br>Raccogli monete, evita il traffico e raggiungi livelli più alti!<br>L’onda d’urto spinge via le auto vicine. Lo scatto distrugge le auto solo in caso di collisione.',gameOver:'FINE PARTITA',finalScore:'Punteggio finale: ',stageCoins:'Livello {stage}  •  Monete {coins}',playAgain:'Premi INIZIA per giocare ancora',title:'SCEGLI LE VITE E PREMI INIZIA',lifeOptions:'3 / 5 / 10 vite'},
 ru:{name:'Русский',language:'🌐 Язык',score:'Счёт',coins:'Монеты',stage:'Этап',lives:'Жизни',selectLives:'❤️ ВЫБЕРИТЕ ЖИЗНИ',left:'⬅ ВЛЕВО',brake:'⬇ ТОРМОЗ',boost:'⬆ УСКОРЕНИЕ',right:'ВПРАВО ➡',start:'СТАРТ',shock:'💥 УДАРНАЯ ВОЛНА<br>5 МОНЕТ',dash:'🔥 РЫВОК<br>10 МОНЕТ',help:'Клавиатура: ← → движение · ↑ ускорение · ↓ тормоз<br>Собирайте монеты, избегайте машин и проходите новые этапы!<br>Ударная волна отталкивает ближайшие машины. Рывок уничтожает машины только при столкновении.',gameOver:'ИГРА ОКОНЧЕНА',finalScore:'Итоговый счёт: ',stageCoins:'Этап {stage}  •  Монеты {coins}',playAgain:'Нажмите СТАРТ, чтобы сыграть снова',title:'ВЫБЕРИТЕ ЖИЗНИ И НАЖМИТЕ СТАРТ',lifeOptions:'3 / 5 / 10 жизней'}
};
function detectLanguage(){const list=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'en']).map(x=>String(x).toLowerCase());for(const x of list){if(x.startsWith('zh'))return 'zh';for(const c of ['en','ko','ja','es','fr','de','pt','it','ru'])if(x.startsWith(c))return c;}return 'en';}
let currentLanguage='en';
function tr(key){return (LANGUAGES[currentLanguage]||LANGUAGES.en)[key]||LANGUAGES.en[key]||key;}
function applyLanguage(code,save=true){
 currentLanguage=LANGUAGES[code]?code:'en';document.documentElement.lang=currentLanguage;
 document.title='No Stress Racing';
 $('languageLabel').textContent=tr('language');$('scoreLabel').textContent=tr('score');$('coinsLabel').textContent=tr('coins');$('stageLabel').textContent=tr('stage');$('livesLabel').textContent=tr('lives');$('lifeChoiceLabel').textContent=tr('selectLives');
 $('leftBtn').textContent=tr('left');$('brakeBtn').textContent=tr('brake');$('boostBtn').textContent=tr('boost');$('rightBtn').textContent=tr('right');$('start').textContent=tr('start');$('shock').innerHTML=tr('shock');$('dash').innerHTML=tr('dash');$('help').innerHTML=tr('help');
 const sel=$('languageSelect');if(sel.value!==currentLanguage)sel.value=currentLanguage;
 [...$('lifeSelect').options].forEach((o,i)=>{const n=[3,5,10][i];o.textContent=currentLanguage==='en'?`${n} Lives`:currentLanguage==='ko'?`목숨 ${n}개`:currentLanguage==='ja'?`${n} ライフ`:currentLanguage==='zh'?`${n} 条生命`:currentLanguage==='es'?`${n} vidas`:currentLanguage==='fr'?`${n} vies`:currentLanguage==='de'?`${n} Leben`:currentLanguage==='pt'?`${n} vidas`:currentLanguage==='it'?`${n} vite`:`${n} жизней`;});
 if(save){try{localStorage.setItem(LANGUAGE_KEY,currentLanguage)}catch(e){}}
}
Object.keys(LANGUAGES).forEach(code=>{const o=document.createElement('option');o.value=code;o.textContent=LANGUAGES[code].name;$('languageSelect').appendChild(o)});
$('languageSelect').addEventListener('change',()=>applyLanguage($('languageSelect').value,true));
let savedLanguage='';try{savedLanguage=localStorage.getItem(LANGUAGE_KEY)||''}catch(e){}
applyLanguage(LANGUAGES[savedLanguage]?savedLanguage:detectLanguage(),false);


let keys={};
let player,traffic,coinsOnRoad,particles;
let score=0,coins=0,stage=1,lives=3;
let distance=0,speed=4,roadOffset=0;
let spawnTimer=0,coinTimer=0;
let running=false,gameOver=false;
let dashTime=0,shockTime=0,invincible=0;
let last=0;

function reset(){
 player={x:218,y:570,w:44,h:76};
 traffic=[];
 coinsOnRoad=[];
 particles=[];
 score=0;coins=0;stage=1;
 lives=Number($("lifeSelect").value);
 distance=0;speed=4;roadOffset=0;
 spawnTimer=0;coinTimer=0;
 dashTime=0;shockTime=0;invincible=0;
 gameOver=false;running=true;
 updateInfo();
}

function updateInfo(){
 $("score").textContent=Math.floor(score);
 $("coins").textContent=coins;
 $("stage").textContent=stage;
 $("lives").textContent=lives;
}

function road(){
 // Road background
 ctx.fillStyle="#287443";
 ctx.fillRect(0,0,480,720);

 ctx.fillStyle="#343a42";
 ctx.fillRect(55,0,370,720);

 // Road borders
 ctx.fillStyle="#f4f0d0";
 ctx.fillRect(67,0,5,720);
 ctx.fillRect(408,0,5,720);

 // Continuous scrolling lane markings
 ctx.fillStyle="#f2dc75";

 const spacing=110;
 const markHeight=55;
 const offset=roadOffset%spacing;

 for(let y=-spacing;y<720+spacing;y+=spacing){
   let yy=y+offset;
   ctx.fillRect(190,yy,7,markHeight);
   ctx.fillRect(283,yy,7,markHeight);
 }
}

function drawCar(x,y,color,playerCar=false){
 ctx.fillStyle="rgba(0,0,0,.3)";
 ctx.fillRect(x+4,y+7,40,68);

 ctx.fillStyle=color;
 ctx.fillRect(x+5,y+7,34,62);

 ctx.fillStyle="#172331";
 ctx.fillRect(x+9,y+19,26,18);
 ctx.fillRect(x+9,y+45,26,13);

 ctx.fillStyle="#b9e7f5";
 ctx.fillRect(x+11,y+21,22,13);

 ctx.fillStyle="#ffe99a";
 ctx.fillRect(x+7,y+3,9,5);
 ctx.fillRect(x+28,y+3,9,5);

 ctx.fillStyle="#171717";
 ctx.fillRect(x,y+17,5,17);
 ctx.fillRect(x+39,y+17,5,17);
 ctx.fillRect(x,y+49,5,17);
 ctx.fillRect(x+39,y+49,5,17);

 if(playerCar){
  ctx.fillStyle="#fff";
  ctx.fillRect(x+13,y+39,18,3);
 }
}

function drawCoin(c){
 ctx.beginPath();
 ctx.arc(c.x,c.y,12,0,Math.PI*2);
 ctx.fillStyle="#ffc928";
 ctx.fill();
 ctx.strokeStyle="#fff0a0";
 ctx.lineWidth=3;
 ctx.stroke();

 ctx.fillStyle="#9b6410";
 ctx.font="bold 15px Arial";
 ctx.textAlign="center";
 ctx.fillText("$",c.x,c.y+5);
}

function spawnTraffic(){
 let lanes=[105,215,325];
 let lane=lanes[Math.floor(Math.random()*lanes.length)];

 traffic.push({
  x:lane,
  y:-90,
  w:44,
  h:76,
  color:["#e84b4b","#458de0","#d4a52e","#a45bd1"][Math.floor(Math.random()*4)],
  v:1+Math.random()*1.5
 });
}

function spawnCoin(){
 let lanes=[105,215,325];
 coinsOnRoad.push({
  x:lanes[Math.floor(Math.random()*lanes.length)]+22,
  y:-25
 });
}

function hit(a,b){
 return a.x<b.x+b.w &&
        a.x+a.w>b.x &&
        a.y<b.y+b.h &&
        a.y+a.h>b.y;
}

function burst(x,y,color){
 for(let i=0;i<18;i++){
  particles.push({
   x,y,
   vx:(Math.random()-.5)*8,
   vy:(Math.random()-.5)*8,
   life:30,
   color
  });
 }
}

function shockwave(){
 if(!running||coins<5)return;

 coins-=5;
 shockTime=35;

 traffic.forEach(t=>{
  if(Math.abs(t.y-player.y)<260){
   burst(t.x+22,t.y+35,"#4bdcff");
   t.y=-200;
   score+=30;
  }
 });

 updateInfo();
}

function dash(){
 if(!running||coins<10||dashTime>0)return;

 coins-=10;
 dashTime=120;
 burst(player.x+22,player.y+30,"#ff9d32");
 updateInfo();
}

function movePlayer(factor){
 let accel=keys.ArrowUp?0.11:0;
 let brake=keys.ArrowDown?0.13:0;

 let target=4+stage*.45+accel*18-brake*12;
 speed+=(target-speed)*.045*factor;
 speed=Math.max(2.2,Math.min(11,speed));

 let move=0;
 if(keys.ArrowLeft)move-=5;
 if(keys.ArrowRight)move+=5;

 player.x+=move*factor;
 player.x=Math.max(76,Math.min(360,player.x));
}

function update(dt){
 if(!running)return;

 let factor=dt/16.67;

 movePlayer(factor);

 let actualSpeed=speed+(dashTime>0?5:0);

 if(dashTime>0)dashTime=Math.max(0,dashTime-factor);
 if(shockTime>0)shockTime=Math.max(0,shockTime-factor);
 if(invincible>0)invincible=Math.max(0,invincible-factor);

 distance+=actualSpeed*factor;
 roadOffset=(roadOffset+actualSpeed*factor)%110;
 score+=actualSpeed*.08*factor;

 let newStage=Math.floor(distance/1400)+1;

 if(newStage>stage){
  stage=newStage;
  coins+=5;
 
 }

 spawnTimer-=factor;
 coinTimer-=factor;

 if(spawnTimer<=0){
  spawnTraffic();
  spawnTimer=Math.max(24,75-stage*4);
 }

 if(coinTimer<=0){
  spawnCoin();
  coinTimer=65;
 }

 traffic.forEach(t=>{
  t.y+=(actualSpeed*.65+t.v+stage*.25)*factor;

  let playerBox={
   x:player.x+5,
   y:player.y+7,
   w:34,
   h:62
  };

  let trafficBox={
   x:t.x+5,
   y:t.y+7,
   w:34,
   h:62
  };

  if(hit(playerBox,trafficBox)){
   if(dashTime>0){
    // Dash destroys only on actual collision
    burst(t.x+22,t.y+35,"#ff9d32");
    t.y=900;
    score+=50;
   }else if(invincible<=0){
    burst(player.x+22,player.y+35,"#ff4949");
    t.y=900;
    lives--;
    invincible=65;

    if(lives<=0){
     lives=0;
     running=false;
     gameOver=true;
    }
   }
  }
 });

 traffic=traffic.filter(t=>t.y<800);

 coinsOnRoad.forEach(c=>{
  c.y+=actualSpeed*factor;

  if(Math.hypot(c.x-(player.x+22),c.y-(player.y+38))<35){
   c.y=900;
   coins++;
   score+=20;
   burst(c.x,c.y,"#ffda42");
  }
 });

 coinsOnRoad=coinsOnRoad.filter(c=>c.y<800);

 particles.forEach(p=>{
  p.x+=p.vx*factor;
  p.y+=p.vy*factor;
  p.life-=factor;
 });

 particles=particles.filter(p=>p.life>0);

 updateInfo();
}

function draw(){
 road();

 coinsOnRoad.forEach(drawCoin);
 traffic.forEach(t=>drawCar(t.x,t.y,t.color));

 if(running){
  if(dashTime>0){
   ctx.fillStyle="rgba(255,130,30,.12)";
   ctx.fillRect(0,0,480,720);
  }

  if(shockTime>0){
   ctx.beginPath();
   ctx.arc(
    player.x+22,
    player.y+38,
    160*(1-shockTime/45),
    0,
    Math.PI*2
   );
   ctx.strokeStyle="#48dfff";
   ctx.lineWidth=9;
   ctx.stroke();
  }

  // Player flashes briefly after a collision
  if(invincible<=0||Math.floor(invincible/5)%2===0){
   drawCar(
    player.x,
    player.y,
    dashTime>0?"#ff8b24":"#35c9ef",
    true
   );
  }

  // Small dash countdown above the player
  if(dashTime>0){
   let seconds=(dashTime/60).toFixed(1);
   ctx.fillStyle="rgba(0,0,0,.75)";
   ctx.fillRect(player.x-3,player.y-32,50,23);
   ctx.fillStyle="#ffbd56";
   ctx.font="bold 16px Arial";
   ctx.textAlign="center";
   ctx.fillText("🔥 "+seconds+"s",player.x+22,player.y-15);
  }

 }else{
  ctx.fillStyle="rgba(0,0,0,.76)";
  ctx.fillRect(0,0,480,720);

  ctx.textAlign="center";
  ctx.fillStyle="#ffd54a";
  ctx.font="bold 36px Arial";

  if(gameOver){
   ctx.fillText(tr("gameOver"),240,290);
   ctx.fillStyle="white";
   ctx.font="20px Arial";
   ctx.fillText(tr("finalScore")+Math.floor(score),240,340);
   ctx.fillText(tr("stageCoins").replace("{stage}",stage).replace("{coins}",coins),240,380);
   ctx.font="16px Arial";
   ctx.font="16px Arial";
    ctx.fillText(tr("playAgain"),240,430);
  }else{
   ctx.fillText("NO STRESS RACING",240,290);
   ctx.fillStyle="white";
   ctx.font="20px Arial";
   ctx.fillText(tr("title"),240,350);
   ctx.font="18px Arial";
   ctx.fillText(tr("lifeOptions"),240,390);
  }
 }

 particles.forEach(p=>{
  ctx.globalAlpha=Math.max(0,p.life/30);
  ctx.fillStyle=p.color;
  ctx.fillRect(p.x,p.y,6,6);
  ctx.globalAlpha=1;
 });
}

function loop(time){
 let dt=Math.min(40,time-last||16.67);
 last=time;

 update(dt);
 draw();

 requestAnimationFrame(loop);
}

document.addEventListener("keydown",e=>{
 if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key)){
  e.preventDefault();
 }
 keys[e.key]=true;
});

document.addEventListener("keyup",e=>{
 keys[e.key]=false;
});

window.addEventListener("blur",()=>{
 keys={};
});

document.querySelectorAll("[data-key]").forEach(btn=>{
 const key=btn.dataset.key;

 btn.addEventListener("pointerdown",e=>{
  e.preventDefault();
  keys[key]=true;
 });

 ["pointerup","pointerleave","pointercancel"].forEach(ev=>{
  btn.addEventListener(ev,()=>{
   keys[key]=false;
  });
 });
});

$("start").addEventListener("click",reset);
$("shock").addEventListener("click",shockwave);
$("dash").addEventListener("click",dash);

// Initial screen: 3 lives selected by default
player={x:218,y:570,w:44,h:76};
traffic=[];
coinsOnRoad=[];
particles=[];
updateInfo();
requestAnimationFrame(loop);
</script>
</body>
</html>
