
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NO STRESS RACING</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#fff;font-family:Arial,sans-serif;text-align:center;padding:12px}
h1{color:#8ee8ff;font-size:clamp(23px,5vw,34px);margin:8px}
.sub{color:#aabbd0;font-size:13px;margin-bottom:12px}
.game{max-width:650px;margin:auto}
.stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px}
.stat{background:#202e45;border:1px solid #3a506d;border-radius:10px;padding:8px 14px;min-width:85px}
.stat small{display:block;color:#a9bed3;font-size:11px}
.stat b{font-size:18px}
canvas{width:100%;height:auto;display:block;border:2px solid #405775;border-radius:13px;background:#26384a;touch-action:none}
.controls{display:flex;justify-content:center;gap:12px;margin:12px}
button,select{border:0;border-radius:10px;padding:12px 17px;font-weight:bold;color:white;background:#304967;font-size:15px}
button:active{filter:brightness(1.4);transform:scale(.97)}
.primary{background:#12a9bb;color:#071c25}
#nitro{background:#bd5bfa}
.help{font-size:12px;color:#aabbd0;line-height:1.8}
.msg{min-height:24px;color:#8ee8ff;font-weight:bold;margin:7px}
@media(max-width:450px){body{padding:7px 5px}.stat{min-width:70px;padding:7px}.controls button{padding:13px 19px}}
</style>
</head>
<body>
<div class="game">
<h1>🏁 NO STRESS RACING</h1>
<div class="sub">Drive freely. Enjoy the ride!</div>
<div class="stats">
 <div class="stat"><small>SCORE</small><b id="score">0</b></div>
 <div class="stat"><small>BEST</small><b id="best">0</b></div>
 <div class="stat"><small>STAGE</small><b id="stage">1</b></div>
 <div class="stat"><small>COINS</small><b id="coins">0</b></div>
</div>
<div class="controls">
 <select id="car">
  <option value="#48d9ff">Blue Car</option>
  <option value="#ff596f">Red Car</option>
  <option value="#ffe16b">Yellow Car</option>
  <option value="#9cff8d">Green Car</option>
  <option value="#d6a0ff">Purple Car</option>
 </select>
 <button class="primary" id="start">▶ START</button>
 <button id="pause">Ⅱ PAUSE</button>
</div>
<canvas id="game" width="480" height="720"></canvas>
<div class="msg" id="msg">Press START to begin!</div>
<div class="controls">
 <button id="left">◀ LEFT</button>
 <button id="nitro">⚡ NITRO</button>
 <button id="right">RIGHT ▶</button>
</div>
<div class="help">
 PC: ← → or A / D to steer · SPACE for Nitro<br>
 Mobile: Use the buttons or drag your car<br>
 Avoid traffic and collect coins!
</div>
</div>
<script>
(()=>{
const c=document.getElementById("game"),ctx=c.getContext("2d");
const $=id=>document.getElementById(id);
const W=480,H=720;
let running=false,paused=false,over=false;
let score=0,coins=0,stage=1,best=0;
let speed=4,roadOffset=0,traffic=[],items=[];
let nitro=100,nitroOn=false;
let color=$("car").value;
let car={x:240,y:590,w:48,h:82};
let keys={},last=0,spawn=0,coinSpawn=0;
const lanes=[130,240,350];
try{best=Number(localStorage.getItem("nsr-best"))||0}catch(e){}
$("best").textContent=best;

function stats(){
 $("score").textContent=Math.floor(score);
 $("best").textContent=best;
 $("stage").textContent=stage;
 $("coins").textContent=coins;
}
function say(t){$("msg").textContent=t}
function reset(){
 score=0;coins=0;stage=1;speed=4;
 traffic=[];items=[];nitro=100;
 car.x=240;running=true;paused=false;over=false;
 $("pause").textContent="Ⅱ PAUSE";
 stats();say("Good luck! Drive safely!");
}
function start(){
 if(over||!running)reset();
}
function carDraw(x,y,w,h,col){
 ctx.fillStyle="#0008";
 ctx.beginPath();ctx.roundRect(x-w/2+4,y-h/2+6,w,h,10);ctx.fill();
 ctx.fillStyle=col;
 ctx.beginPath();ctx.roundRect(x-w/2,y-h/2,w,h,10);ctx.fill();
 ctx.fillStyle="#bdeeff";
 ctx.beginPath();ctx.roundRect(x-w/2+7,y-h/2+12,w-14,20,5);ctx.fill();
 ctx.fillStyle="#263447";
 ctx.fillRect(x-w/2+7,y+4,w-14,18);
 ctx.fillStyle="#fff3a1";
 ctx.fillRect(x-w/2+5,y-h/2+3,9,5);
 ctx.fillRect(x+w/2-14,y-h/2+3,9,5);
 ctx.fillStyle="#141c29";
 ctx.fillRect(x-w/2-4,y-h/2+16,5,18);
 ctx.fillRect(x+w/2-1,y-h/2+16,5,18);
 ctx.fillRect(x-w/2-4,y+h/2-32,5,18);
 ctx.fillRect(x+w/2-1,y+h/2-32,5,18);
}
function road(){
 ctx.fillStyle="#246044";ctx.fillRect(0,0,W,H);
 ctx.fillStyle="#343b48";ctx.fillRect(55,0,370,H);
 ctx.fillStyle="#e9e4bd";
 ctx.fillRect(55,0,7,H);ctx.fillRect(419,0,7,H);
 roadOffset=(roadOffset+speed*(nitroOn?1.7:1))%90;
 ctx.fillStyle="#d5d7d9";
 for(let y=-90+roadOffset;y<H;y+=90){
  ctx.fillRect(177,y,5,48);
  ctx.fillRect(298,y,5,48);
 }
}
function spawnTraffic(){
 let lane=lanes[Math.floor(Math.random()*3)];
 traffic.push({x:lane,y:-80,color:["#ff5d6c","#ffc95b","#ad91ff","#65d8a5"][Math.floor(Math.random()*4)]});
}
function spawnCoin(){
 let lane=lanes[Math.floor(Math.random()*3)];
 items.push({x:lane,y:-25});
}
function collide(a,b){
 return Math.abs(a.x-b.x)<39&&Math.abs(a.y-b.y)<68;
}
function update(dt){
 if(!running||paused||over)return;
 let d=Math.min(dt/16.67,2);
 let boost=nitroOn&&nitro>0;
 if(boost)nitro=Math.max(0,nitro-0.8*d);
 else nitro=Math.min(100,nitro+0.12*d);
 let move=5.5*d*(boost?1.2:1);
 if(keys.left)car.x-=move;
 if(keys.right)car.x+=move;
 car.x=Math.max(91,Math.min(389,car.x));
 speed=4+Math.min(stage*.35,4)+(boost?3:0);
 score+=speed*.08*d;
 stage=1+Math.floor(score/500);
 spawn+=dt;
 coinSpawn+=dt;
 if(spawn>Math.max(430,1050-stage*45)){
  spawn=0;spawnTraffic();
 }
 if(coinSpawn>1500){
  coinSpawn=0;spawnCoin();
 }
 for(let t of traffic){
  t.y+=speed*d;
  if(collide(car,t)){end();return}
 }
 traffic=traffic.filter(t=>t.y<H+100);
 for(let i of items){
  i.y+=speed*d;
  if(Math.abs(i.x-car.x)<34&&Math.abs(i.y-car.y)<48){
   coins++;score+=50;i.caught=true;say("🪙 Coin collected!");
  }
 }
 items=items.filter(i=>!i.caught&&i.y<H+30);
 if(score>best){
  best=Math.floor(score);
  try{localStorage.setItem("nsr-best",best)}catch(e){}
 }
 stats();
}
function end(){
 running=false;over=true;nitroOn=false;
 say("🏁 CRASH! Press START to race again.");
}
function draw(){
 road();
 for(let t of traffic)carDraw(t.x,t.y,48,82,t.color);
 for(let i of items){
  ctx.fillStyle="#ffd84e";
  ctx.beginPath();ctx.arc(i.x,i.y,13,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#8c5a00";ctx.font="bold 16px Arial";
  ctx.textAlign="center";ctx.fillText("$",i.x,i.y+6);
 }
 if(running||!over)carDraw(car.x,car.y,car.w,car.h,color);
 if(nitroOn&&nitro>0&&running){
  ctx.fillStyle="#66dfff";
  ctx.beginPath();ctx.moveTo(car.x-12,car.y+40);
  ctx.lineTo(car.x,car.y+75+Math.random()*15);
  ctx.lineTo(car.x+12,car.y+40);ctx.fill();
 }
 if(!running||paused){
  ctx.fillStyle="#08111dbb";ctx.fillRect(55,0,370,H);
  ctx.textAlign="center";ctx.fillStyle="white";
  ctx.font="bold 34px Arial";
  ctx.fillText(over?"RACE OVER":paused?"PAUSED":"READY",240,330);
  ctx.font="17px Arial";ctx.fillStyle="#b8d6e9";
  ctx.fillText(over?"Press START to retry":paused?"Press PAUSE to resume":"Press START",240,370);
 }
 ctx.fillStyle="#d9e8f4";ctx.fillRect(15,18,100,9);
 ctx.fillStyle="#40d7ff";ctx.fillRect(15,18,nitro,9);
 ctx.font="11px Arial";ctx.textAlign="left";
 ctx.fillStyle="white";ctx.fillText("NITRO",15,14);
}
function frame(t){
 let dt=last?Math.min(t-last,40):16.67;last=t;
 update(dt);draw();requestAnimationFrame(frame);
}
function setKey(k,v){keys[k]=v}
$("start").onclick=start;
$("pause").onclick=()=>{
 if(!running)return;
 paused=!paused;
 $("pause").textContent=paused?"▶ RESUME":"Ⅱ PAUSE";
 say(paused?"Take a break!":"Back to racing!");
};
$("car").onchange=()=>color=$("car").value;
function bindHold(id,k){
 let b=$(id);
 b.addEventListener("pointerdown",e=>{e.preventDefault();setKey(k,true);b.setPointerCapture(e.pointerId)});
 ["pointerup","pointercancel","lostpointercapture"].forEach(ev=>b.addEventListener(ev,()=>setKey(k,false)));
}
bindHold("left","left");bindHold("right","right");
$("nitro").addEventListener("pointerdown",e=>{e.preventDefault();nitroOn=true});
["pointerup","pointercancel","pointerleave"].forEach(ev=>$("nitro").addEventListener(ev,()=>nitroOn=false));
document.addEventListener("keydown",e=>{
 if(["ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=true;
 if(e.key===" ")nitroOn=true;
 if(e.key.toLowerCase()==="p")$("pause").click();
});
document.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=false;
 if(e.key===" ")nitroOn=false;
});
window.addEventListener("blur",()=>{keys={};nitroOn=false});
let dragging=false;
c.addEventListener("pointerdown",e=>{dragging=true;movePointer(e)});
c.addEventListener("pointermove",e=>{if(dragging)movePointer(e)});
["pointerup","pointercancel","pointerleave"].forEach(ev=>c.addEventListener(ev,()=>dragging=false));
function movePointer(e){
 let r=c.getBoundingClientRect();
 car.x=Math.max(91,Math.min(389,(e.clientX-r.left)/r.width*W));
}
reset();running=false;over=false;say("Press START to begin!");
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
